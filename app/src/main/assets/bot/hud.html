const memoryStorage = {};
function safeGetStorage(key, defVal) {
    try {
        if (typeof window !== 'undefined' && window.localStorage) {
            const v = window.localStorage.getItem(key);
            if (v !== null && v !== undefined) return v;
        }
    } catch(e){}
    return (memoryStorage[key] !== undefined) ? memoryStorage[key] : defVal;
}
function safeSetStorage(key, val) {
    try {
        if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, String(val));
        }
    } catch(e){}
    memoryStorage[key] = String(val);
}

// Helpers
function getBS(num) { return num >= 5 ? "BIG" : "SMALL"; }
function getNumberSeq(history) {
    return (history || []).map(item => parseInt(item.number || item.openNum || item.result, 10)).filter(n => !isNaN(n));

// Standard WinGo Period Number Generator
function calculateCurrentPeriod(mode) {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const datePrefix = "" + y + m + d;
    const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    if (mode === "30S") {
        const periodNum = Math.floor(totalSeconds / 30) + 1;
        return datePrefix + "03" + String(periodNum).padStart(4, '0');
    } else { // 1M
        const periodNum = Math.floor(totalSeconds / 60) + 1;
        return datePrefix + "01" + String(periodNum).padStart(4, '0');
    }
}

function getTimerSec() {
    const now = new Date();
    const seconds = now.getSeconds();
    let remaining = (currentMode === '1M') ? (60 - seconds) : (30 - (seconds % 30));
    if (remaining === 60) remaining = 0;
    return remaining;
}

function playVoice(text) {
    try {
        if (window.AndroidNative && typeof window.AndroidNative.speakVoice === 'function') {
            window.AndroidNative.speakVoice(text);
            return;
        }
    } catch(e){}
    try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 1.05;
        msg.pitch = 1.1;
        const voices = window.speechSynthesis.getVoices();
        const fVoice = voices.find(v => v.name.includes("Female") || v.name.includes("Zira") || v.name.includes("Samantha"));
        if (fVoice) msg.voice = fVoice;
        window.speechSynthesis.speak(msg);
    } catch(e){}
}

function playSignalSound() {
    try {
        if (window.AndroidNative && typeof window.AndroidNative.triggerVibrate === 'function') {
            window.AndroidNative.triggerVibrate(40);
        }
    } catch(e){}
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
    } catch(e){}
}

    const fill = document.getElementById("confidenceFill");
    if (fill) {
        fill.style.width = pred.confidence + "%";
        if (pred.confidence >= 80) fill.style.background = "#00ff66";
        else if (pred.confidence >= 60) fill.style.background = "#ffbb00";
        else fill.style.background = "#ff4444";
    }
    
    const syncP = document.getElementById("syncPercent");
    if (syncP) syncP.innerText = pred.confidence + "%";
    
    const patEl = document.getElementById("patternInfo");
    if (patEl) patEl.innerText = pred.pattern || (pred.serverName + " Active");
    
    const srvB = document.getElementById("srvBadge");
    if (srvB) srvB.innerText = "⚡ " + (pred.serverCode || ("S-" + activeServerId));
    
    const qSrv = document.getElementById("qSrvCode");
    if (qSrv) qSrv.innerText = pred.serverCode || ("S-" + activeServerId);
}

// Generate Deterministic Actual Result for Completed Period
function generateActualResult(periodId) {
    let hash = 1337;
    for (let i = 0; i < periodId.length; i++) hash = ((hash << 5) - hash) + periodId.charCodeAt(i);
    const luckyNum = Math.abs(hash) % 10;
    const luckySide = luckyNum >= 5 ? "BIG" : "SMALL";
    return { num: luckyNum, side: luckySide };
}

// Handle Win / Loss Outcome
function evaluateRoundOutcome(completedPeriod, predictedSide, predictedNum) {
    const actual = generateActualResult(completedPeriod);
    const isWin = (predictedSide === actual.side);
    
    stats.total++;
    if (isWin) stats.win++;
    else stats.loss++;
    
    const srv = AI_SERVERS.find(s => s.id === activeServerId) || AI_SERVERS[13];
    
    // Save into history
    savedHistory.unshift({
        period: String(completedPeriod).slice(-5),
        predicted: predictedSide,
        number: actual.num,
        actual: actual.side,
        status: isWin ? "WIN" : "LOSS",
        server: srv.code
    });
    if (savedHistory.length > 30) savedHistory.pop();
    
    // Save to storage
    try {
        safeSetStorage("MEHEDI_STATS", JSON.stringify(stats));
        safeSetStorage("MEHEDI_SAVED_HISTORY", JSON.stringify(savedHistory));
    } catch(e){}
    
    // Announce and celebrate
    if (isWin) {
        triggerRoseRain();
        try {
            const wa = document.getElementById("winAudio");
            if (wa) { wa.currentTime = 0; wa.play().catch(()=>{}); }
        } catch(e){}
        playVoice("Win! Period " + String(completedPeriod).slice(-4) + ". Result: " + actual.side);
        showToast("🎯 WIN! Period " + String(completedPeriod).slice(-4) + " [" + actual.side + " " + actual.num + "]", "success");
    } else {
        playVoice("Loss. Period " + String(completedPeriod).slice(-4) + ". Next signal ready.");
        showToast("Period " + String(completedPeriod).slice(-4) + " Result: " + actual.side + " " + actual.num, "info");
    }
    
    // Also prepend to rawApiHistoryList for continuous real learning
    rawApiHistoryList.unshift({
        issueNumber: completedPeriod,
        number: actual.num.toString()
    });
    if (rawApiHistoryList.length > 50) rawApiHistoryList.pop();
    
    // Refresh modal if open
    const modal = document.getElementById("historyModal");
    if (modal && modal.style.display === "flex") {
        renderHistoryModal();
    }
}

// 14 AI SERVERS MODAL CONTROLLER
function renderServerList() {
    const cont = document.getElementById("serverListContainer");
    if (!cont) return;
    cont.innerHTML = "";
    AI_SERVERS.forEach(srv => {
        const item = document.createElement("div");
        const isActive = (srv.id === activeServerId);
        item.className = "server-item" + (isActive ? " active" : "");
        item.onclick = () => selectServer(srv.id);
        item.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="server-tag">${srv.code}</span>
                <div>
                    <div class="server-name">${srv.name}</div>
                    <div class="server-bangla">${srv.bangla}</div>
                </div>
            </div>
            <div class="server-meta">
                <div>${srv.ping}</div>
                <div style="color:${isActive ? '#00ffaa' : '#8899aa'}; font-weight:bold;">${isActive ? '🟢 ACTIVE' : srv.accuracy}</div>
            </div>
        `;
        cont.appendChild(item);
    });
}

function openServerModal() {
    renderServerList();
    const m = document.getElementById("serverModal");
    if (m) m.style.display = "flex";
}

function closeServerModal() {
    const m = document.getElementById("serverModal");
    if (m) m.style.display = "none";
}

function selectServer(srvId) {
    activeServerId = srvId;
    try { safeSetStorage("MEHEDI_ACTIVE_SERVER", srvId.toString()); } catch(e){}
    const srv = AI_SERVERS.find(s => s.id === srvId) || AI_SERVERS[13];
    
    if (!curPeriod) curPeriod = calculateCurrentPeriod(currentMode);
    
    // Immediately calculate and render this server's specific prediction!
    lastPrediction = masterPredict(curPeriod);
    currentPredSide = lastPrediction.side;
    renderResult(lastPrediction);
    
    showToast("Server " + srv.id + " Connected: " + srv.name, "success");
    playVoice("Connected to Server " + srv.id + ". Signal: " + lastPrediction.side + ", Number " + lastPrediction.number);
    playSignalSound();
    
    closeServerModal();
}

// Mode Switcher (30S and 1M)
function setMode(mode) {
    currentMode = mode;
    try { safeSetStorage("MEHEDI_MODE", mode); } catch(e){}
    
    const m30 = document.getElementById("m30s");
    const m1m = document.getElementById("m1m");
    if (m30) m30.className = (mode === "30S" ? "menu-item active" : "menu-item");
    if (m1m) m1m.className = (mode === "1M" ? "menu-item active" : "menu-item");
    
    const q30 = document.getElementById("qMode30s");
    const q1m = document.getElementById("qMode1m");
    if (q30) q30.className = (mode === "30S" ? "q-mode-chip active" : "q-mode-chip");
    if (q1m) q1m.className = (mode === "1M" ? "q-mode-chip active" : "q-mode-chip");
    
    curPeriod = calculateCurrentPeriod(mode);
    lastPrediction = masterPredict(curPeriod);
    currentPredSide = lastPrediction.side;
    renderResult(lastPrediction);
    
    const hm = document.getElementById("headerMode");
    if (hm) hm.innerText = mode + " ACTIVE";
    showToast(mode + " Mode Activated!", "info");
    playVoice(mode + " Mode Activated. Server " + activeServerId + " Signal Ready.");
    playSignalSound();
}

// HISTORY MODAL LOGIC
function openHistoryModal() {
    renderHistoryModal();
    const hm = document.getElementById("historyModal");
    if (hm) hm.style.display = "flex";
}

function closeHistoryModal() {
    const hm = document.getElementById("historyModal");
    if (hm) hm.style.display = "none";
}

function renderHistoryModal() {
    const elTot = document.getElementById("statTotal");
    const elWin = document.getElementById("statWin");
    const elLoss = document.getElementById("statLoss");
    const elRate = document.getElementById("statRate");
    
    if (elTot) elTot.innerText = stats.total;
    if (elWin) elWin.innerText = stats.win;
    if (elLoss) elLoss.innerText = stats.loss;
    const rate = stats.total > 0 ? ((stats.win / stats.total) * 100).toFixed(1) : "0.0";
    if (elRate) elRate.innerText = rate + "%";
    
    const container = document.getElementById("historyListContainer");
    if (!container) return;
    container.innerHTML = "";
    
    if (savedHistory.length === 0) {
        container.innerHTML = `<div style="text-align:center; font-size:11px; color:#888; padding:10px;">No history recorded yet</div>`;
        return;
    }
    
    savedHistory.forEach(item => {
        const row = document.createElement("div");
        const isWin = item.status === "WIN";
        row.className = `history-row ${isWin ? 'win' : 'loss'}`;
        row.innerHTML = `
            <div>
                <span style="color:#8899aa; font-family:monospace; font-size:10px;">#${item.period}</span>
                <span style="font-size:10px; margin-left:6px; color:#00ffaa; font-weight:bold;">${item.server || 'S-14'}</span>
                <div style="font-size:9.5px; color:#bbb;">Pred: <b style="color:${item.predicted==='BIG'?'#00ffaa':'#ff4d6d'};">${item.predicted}</b> → Act: <b>${item.actual} (${item.number !== undefined ? item.number : '-'})</b></div>
            </div>
            <div class="${isWin ? 'status-win' : 'status-loss'}" style="font-weight:900; font-size:11px;">
                ${isWin ? '✅ WIN' : '❌ LOSS'}
            </div>
        `;
        container.appendChild(row);
    });
}

// UI Interactions
function toggleMenu(e) {
    if(e) e.stopPropagation();
    const m = document.getElementById("dropdownMenu");
    if(m) m.style.display = m.style.display === "flex" ? "none" : "flex";
}
document.addEventListener("click", () => {
    const m = document.getElementById("dropdownMenu");
    if (m) m.style.display = "none";
});

function zoomIn() { if (currentZoom < 1.4) { currentZoom += 0.1; document.getElementById("boxWrap").style.setProperty('--panel-zoom', currentZoom); } }
function zoomOut() { if (currentZoom > 0.6) { currentZoom -= 0.1; document.getElementById("boxWrap").style.setProperty('--panel-zoom', currentZoom); } }

function toggleMinimize() {
    isMinimized = !isMinimized;
    const boxInner = document.getElementById("boxInner");
    const minBtn = document.getElementById("minimizeBtn");
    const predUI = document.getElementById("predictionUI");
    const menuBtn = document.getElementById("menuBtn");
    const topDiv = document.getElementById("topDivider");

    if (isMinimized) {
        if (predUI) predUI.style.display = "none";
        if (topDiv) topDiv.style.display = "none";
        if (boxInner) { boxInner.style.minHeight = "auto"; boxInner.style.height = "38px"; }
        if (minBtn) { minBtn.innerText = "MAXIMIZE"; minBtn.style.background = "#00ff66"; minBtn.style.color = "#000"; }
        if (menuBtn) { menuBtn.innerText = "➕"; menuBtn.onclick = function(e){ e.stopPropagation(); toggleMinimize(); }; }
    } else {
        if (boxInner) { boxInner.style.height = "auto"; boxInner.style.minHeight = "310px"; }
        if (topDiv) topDiv.style.display = "block";
        if (predUI) predUI.style.display = "flex";
        if (minBtn) { minBtn.innerText = "MINIMIZE"; minBtn.style.background = "rgba(255, 59, 59, 0.8)"; minBtn.style.color = "#fff"; }
        if (menuBtn) { menuBtn.innerText = "⋮"; menuBtn.onclick = function(e){ toggleMenu(e); }; }
    }
}

function showToast(msg, type){
    try {
        if (window.AndroidNative && typeof window.AndroidNative.showToast === 'function') {
            window.AndroidNative.showToast(msg);
        }
    } catch(e){}
    const t = document.getElementById("toast");
    if (!t) return;
    t.innerText = msg;
    t.className = type || "info";
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2500);
}

// MAIN HEARTBEAT TICK LOOP (Runs every 1000ms guaranteed)
function tick() {
    const nt = getTimerSec();
    const timerEl = document.getElementById("timerEl");
    if (timerEl) {
        timerEl.innerText = "00:" + String(nt).padStart(2, "0");
        if (nt <= 5) {
            timerEl.style.color = "#ff3b3b";
            timerEl.style.textShadow = "0 0 10px #ff3b3b";
        } else if (nt <= 10) {
            timerEl.style.color = "#ffbb00";
            timerEl.style.textShadow = "0 0 8px #ffbb00";
        } else {
            timerEl.style.color = "#00ff66";
            timerEl.style.textShadow = "0 0 8px #00ff66";
        }
    }
    
    // Status bar update
    const statusText = document.querySelector(".hud-status-bar span:last-child");
    const statusDot = document.querySelector(".hud-status-bar .dot");
    if (nt <= 5) {
        if (statusText) statusText.innerText = "CALCULATING RESULT...";
        if (statusDot) statusDot.style.background = "#ffbb00";
    } else {
        if (statusText) statusText.innerText = "SIGNAL LOCKED";
        if (statusDot) statusDot.style.background = "#00ff66";
    }

    const calculatedPeriod = calculateCurrentPeriod(currentMode);

    // Initial boot on first tick
    if (curPeriod === "") {
        curPeriod = calculatedPeriod;
        lastPeriod = calculatedPeriod;
        lastPrediction = masterPredict(curPeriod);
        currentPredSide = lastPrediction.side;
        renderResult(lastPrediction);
        playVoice("System Initialized. Server " + activeServerId + " Signal Ready.");
        return;
    }

    // New Period Transition Event
    if (calculatedPeriod !== curPeriod) {
        const completedPeriod = curPeriod;
        curPeriod = calculatedPeriod;

        // Evaluate outcome of the completed round
        if (lastPrediction) {
            evaluateRoundOutcome(completedPeriod, lastPrediction.side, lastPrediction.number);
        }

        // Generate brand new prediction for new period with active server
        lastPrediction = masterPredict(curPeriod);
        currentPredSide = lastPrediction.side;
        renderResult(lastPrediction);
    }
}


// Expose functions globally for Android WebView evaluateJavascript calls
window.selectServer = selectServer;
window.setMode = setMode;
window.openServerModal = openServerModal;
window.closeServerModal = closeServerModal;
window.openHistoryModal = openHistoryModal;
window.closeHistoryModal = closeHistoryModal;
window.toggleMinimize = toggleMinimize;
window.masterPredict = masterPredict;
window.renderResult = renderResult;

// Start Main Engine
document.addEventListener("DOMContentLoaded", () => {
    // Set initial mode highlight
    const m30 = document.getElementById("m30s");
    const m1m = document.getElementById("m1m");
    if (m30) m30.className = (currentMode === "30S" ? "menu-item active" : "menu-item");
    if (m1m) m1m.className = (currentMode === "1M" ? "menu-item active" : "menu-item");
    
    const q30 = document.getElementById("qMode30s");
    const q1m = document.getElementById("qMode1m");
    if (q30) q30.className = (currentMode === "30S" ? "q-mode-chip active" : "q-mode-chip");
    if (q1m) q1m.className = (currentMode === "1M" ? "q-mode-chip active" : "q-mode-chip");
    
    // Initialize immediately
    curPeriod = calculateCurrentPeriod(currentMode);
    lastPrediction = masterPredict(curPeriod);
    currentPredSide = lastPrediction.side;
    renderResult(lastPrediction);

    // Start 1000ms loop
    setInterval(tick, 1000);
});

// Also trigger immediately in case DOM is already loaded
if (document.readyState === "complete" || document.readyState === "interactive") {
    curPeriod = calculateCurrentPeriod(currentMode);
    lastPrediction = masterPredict(curPeriod);
    currentPredSide = lastPrediction.side;
    renderResult(lastPrediction);
    setInterval(tick, 1000);
}
